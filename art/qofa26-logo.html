<!DOCTYPE html><html><head><meta charset="utf-8"><style>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="-50 0 1280 520">
<defs>

 <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14" result="b"/><feColorMatrix in="b" values="1 0 0 0 1  0 .5 0 0 .35  0 0 .2 0 .05  0 0 0 .75 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>

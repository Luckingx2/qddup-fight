<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="online-api" content="">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>큐떱대전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bungee&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0a1c;--pan:#15132e;--line:#34305f;--txt:#f1f0ff;--dim:#a6a3cf;--holo:linear-gradient(100deg,#8ef6ff,#c9a6ff 35%,#ffb3e1 60%,#fff3b0 85%,#8ef6ff);--hot:#ff4d8d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07060f;color:var(--txt);font-family:'IBM Plex Sans KR',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 0%,#1b1840,#07060f 70%)}
#stage{position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;flex:none;background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#app,#stage,#pad,.pb,canvas{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.btn,.card,#snd{touch-action:manipulation}
#pad{display:none}
#cut{position:absolute;inset:0;display:none;background:#000;z-index:5}#cut.on{display:block}#cut video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}#cut video.on{display:block}#cut video.flip{transform:scaleX(-1)}
#cutT{position:absolute;left:0;right:0;top:50%;z-index:3;text-align:center;font-family:'Black Han Sans',sans-serif;font-size:min(15vw,26dvh);line-height:1;color:#fff;-webkit-text-stroke:.05em #ff2d55;text-shadow:0 .06em 0 #7a0020,0 0 .3em rgba(255,45,85,.8);opacity:0;transform:translateY(-50%) rotate(-6deg) scale(.2);transition:transform .2s cubic-bezier(.2,2.2,.4,1),opacity .1s;pointer-events:none}
#cutT.on{opacity:1;transform:translateY(-50%) rotate(-6deg) scale(1)}
#cutH{position:absolute;right:10px;bottom:8px;z-index:2;font-size:11px;color:#fff;opacity:.8;text-shadow:0 1px 3px #000;pointer-events:none}
#keys{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#fff;opacity:.75;text-shadow:0 1px 3px #000;pointer-events:none}
@media (pointer:coarse){#pad{display:block}#keys{display:none}}
.pb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bungee',sans-serif;color:#fff;border:2px solid rgba(255,255,255,.75);background:rgba(20,18,50,.55);box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 0 18px rgba(255,255,255,.12);touch-action:none}
.pb.on{background:rgba(255,255,255,.85);color:#15132e;transform:scale(.94)}
#dpad{width:var(--d);height:var(--d);left:var(--mx);bottom:var(--my)}
#dpad i{position:absolute;font-style:normal;font-size:calc(var(--d)*.17);opacity:.9}
#dpad .u{top:6%}#dpad .dn{bottom:6%}#dpad .l{left:8%}#dpad .r{right:8%}
#dpad .dn,#dpad .u{font-family:'Black Han Sans',sans-serif;font-size:calc(var(--d)*.12)}
#knob{position:absolute;width:38%;height:38%;border-radius:50%;background:var(--holo);opacity:.9;left:31%;top:31%;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#bP{width:var(--b);height:var(--b);right:calc(var(--mx) + var(--b)*1.08);bottom:var(--my);font-size:calc(var(--b)*.36)}
#bK{width:var(--b);height:var(--b);right:var(--mx);bottom:calc(var(--my) + var(--b)*.62);font-size:calc(var(--b)*.36)}
#bS{width:calc(var(--b)*.9);height:calc(var(--b)*.9);right:calc(var(--mx) + var(--b)*.75);bottom:calc(var(--my) + var(--b)*1.2);font-size:calc(var(--b)*.2);font-family:'Black Han Sans',sans-serif;opacity:.45}
#bT{width:calc(var(--b)*.8);height:calc(var(--b)*.8);right:var(--mx);bottom:calc(var(--my) + var(--b)*1.8);font-size:calc(var(--b)*.19);font-family:'Black Han Sans',sans-serif;opacity:.45}
#bT.used{opacity:.18}
#bS.rdy,#bT.rdy{opacity:1;border-color:#fff;background:var(--holo);color:#15132e;animation:pulse .7s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 26px #ffb3e1,0 0 8px #8ef6ff}}
#hint{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--dim);line-height:1.6;pointer-events:none}
@media (orientation:portrait){
  #app{justify-content:flex-start;padding-top:env(safe-area-inset-top)}
  #pad{position:relative;flex:1;width:100%;--d:min(42vw,190px);--b:min(21vw,96px);--mx:5vw;--my:max(26%,90px)}
}
@media (orientation:landscape){
  #pad{position:absolute;inset:0;pointer-events:none;--d:min(30vh,150px);--b:min(17vh,84px);--mx:max(14px,env(safe-area-inset-left));--my:14px}
  #pad .pb{pointer-events:auto;opacity:.72}#pad #bS,#pad #bT{opacity:.4}#pad #bT.used{opacity:.15}#pad #bS.rdy,#pad #bT.rdy{opacity:1}
  #hint{display:none}
}
#snd{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:30;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(21,19,46,.8);color:var(--txt);font:600 12px 'IBM Plex Sans KR',sans-serif;cursor:pointer}
#snd.in{position:absolute;left:50%;right:auto;top:14%;transform:translateX(-50%);width:auto;height:auto;padding:2px 9px;font-size:10px;border-radius:999px;opacity:.75}
.scr{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(130% 90% at 50% -10%,#2a2463 0%,#0f0d27 55%,#07060f 100%);overflow:auto;touch-action:pan-y}
.scr.show{display:flex}
.logo{font-family:'Black Han Sans','Bungee',sans-serif;font-size:clamp(34px,9vw,72px);line-height:1;margin:0;background:var(--holo);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite;letter-spacing:.02em;text-align:center}
.logo small{display:block;font-family:'Black Han Sans',sans-serif;font-size:.26em;letter-spacing:.3em;color:var(--dim);-webkit-text-fill-color:var(--dim);margin-top:8px}
@keyframes sh{to{background-position:200% 0}}
.cards{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:min(100%,640px)}
.pv{display:flex;flex-direction:column;align-items:center;gap:0;flex:0 0 auto}
#pv{height:min(40vh,360px);aspect-ratio:9/10;display:block}
#pvN{font-family:'Bungee',sans-serif;font-size:44px;line-height:1;margin-top:-6px;text-shadow:0 3px 0 rgba(11,10,28,.6)}
#sSel .logo{font-size:clamp(26px,6vw,40px)}
@media (max-width:760px){.cards{grid-template-columns:repeat(5,1fr);max-width:380px;gap:6px}}
@media (max-height:460px) and (orientation:landscape){#sSel{flex-direction:row;flex-wrap:wrap;align-content:center;gap:8px 22px}#sSel .logo{width:100%;font-size:24px}#sSel .logo small{display:none}#pv{height:52vh}#pvN{font-size:30px}.cards{width:min(52%,430px);gap:5px}#sSel .sub{width:100%}}
.card{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:var(--pan);cursor:pointer;padding:0;color:inherit;font:inherit;text-align:left;transition:transform .12s,border-color .12s}
.card img{display:block;width:100%;aspect-ratio:330/400;object-fit:cover;object-position:50% 12%}
.card{border-radius:12px}.card img{aspect-ratio:1/1!important;object-position:50% 42%!important}.card b{display:block;text-align:center;font-family:'Bungee',sans-serif;font-size:12px;line-height:1;padding:3px 0 2px;background:rgba(11,10,28,.72)}
.card span{display:block;padding:8px 10px 10px;font-size:12px;color:var(--dim);line-height:1.45}
.card span em{display:block;font-style:normal;font-family:'Black Han Sans',sans-serif;font-size:16px;color:var(--txt)}
.card.sel{border-color:#fff;transform:translateY(-4px);box-shadow:0 0 0 3px rgba(201,166,255,.5),0 14px 30px rgba(0,0,0,.5)}
.btn{font-family:'Black Han Sans',sans-serif;font-size:20px;padding:13px 30px;border-radius:999px;border:0;background:var(--holo);color:#15132e;cursor:pointer;box-shadow:0 6px 0 #6b5fb0,0 12px 24px rgba(0,0,0,.4)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6b5fb0}
#sNet{z-index:40;background:rgba(7,6,15,.9)}.nbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 22px;border-radius:20px;border:2px solid var(--line);background:var(--pan);max-width:360px;width:100%;text-align:center}.nbox h3{margin:0;font-family:'Black Han Sans',sans-serif;font-size:22px}.nbox p{margin:0;color:var(--dim);font-size:13px;line-height:1.5}.nbox .code{font-family:'Bungee',sans-serif;font-size:46px;letter-spacing:.14em;color:#fff;user-select:all;-webkit-user-select:all}.nbox input{font-family:'Bungee',sans-serif;font-size:32px;letter-spacing:.14em;text-align:center;text-transform:uppercase;width:100%;padding:10px;border-radius:12px;border:2px solid var(--line);background:#0b0a1c;color:#fff;outline:none}#netRow .btn{font-size:14px;padding:8px 16px}
#sTitle{background:#07060f;gap:12px;padding:0 0 calc(14px + env(safe-area-inset-bottom));justify-content:center;overflow:hidden}#sTitle::before{content:'';position:absolute;inset:-40px;background:url(assets/title.jpg) center/cover;filter:blur(26px) brightness(.45);z-index:0}#ttl{position:relative;z-index:1;display:block;width:100%;flex:0 1 auto;min-height:0;max-height:calc(100% - 84px);object-fit:contain}#titleForm{position:relative;z-index:1;display:grid;justify-items:center;gap:8px;width:min(92%,360px);flex:0 0 auto}#nick{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#15132e;color:var(--txt);font:inherit;font-size:16px;text-align:center}#ttl{max-height:calc(100% - 145px)}#onlineRow .btn{font-size:14px;padding:8px 16px}.rankList{width:100%;border-collapse:collapse;color:var(--txt);font-size:13px}.rankList td,.rankList th{padding:6px;border-bottom:1px solid var(--line)}.rankList td:nth-child(2){overflow-wrap:anywhere}#netBox .rankList{display:block;max-height:55vh;overflow:auto}#tGo{position:relative;z-index:1;flex:0 0 auto;font-size:22px;padding:13px 44px;animation:tp 1.2s ease-in-out infinite}@keyframes tp{50%{transform:scale(1.07)}}
.btn.ghost{background:transparent;color:var(--txt);border:2px solid var(--line);box-shadow:none;font-size:16px;padding:10px 22px}
.btn[disabled]{opacity:.35;pointer-events:none}
.sub{color:var(--dim);font-size:13px;margin:0;text-align:center}
.vsrow{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,40px);width:100%}
.slot{width:clamp(120px,34vw,250px);perspective:700px;text-align:center}
.slot .face{border-radius:18px;overflow:hidden;border:3px solid #fff;background:var(--pan);box-shadow:0 14px 30px rgba(0,0,0,.5);transform-style:preserve-3d}
.slot img{display:block;width:100%;aspect-ratio:330/400;object-fit:cover;object-position:50% 12%}
.slot h3{font-family:'Bungee',sans-serif;font-size:clamp(26px,7vw,52px);margin:8px 0 0;line-height:1}
.slot p{margin:2px 0 0;font-size:12px;color:var(--dim);letter-spacing:.2em}
.vs{font-family:'Bungee',sans-serif;font-size:clamp(28px,8vw,64px);color:var(--hot);text-shadow:0 4px 0 #5a0f33}
.tumble{animation:tb .16s ease-out}
@keyframes tb{from{transform:rotateX(-88deg) rotateZ(-8deg) scale(.86)}to{transform:none}}
.lock{animation:lk .5s ease-out}
@keyframes lk{0%{transform:scale(1.18);filter:brightness(2.2)}100%{transform:none;filter:none}}
.dice{display:inline-grid;grid-template-columns:repeat(3,7px);gap:4px;padding:8px;border-radius:9px;background:#fff;vertical-align:middle;margin-right:8px}
.dice i{width:7px;height:7px;border-radius:50%;background:#15132e}
.dice i.o{background:transparent}
.dice.roll{animation:dr .32s linear infinite}
@keyframes dr{to{transform:rotate(360deg)}}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,720px)}
.stg{border-radius:10px;overflow:hidden;border:2px solid var(--line);opacity:.4;transition:opacity .08s;position:relative}
.stg img{display:block;width:100%;aspect-ratio:7/3;object-fit:cover}
.stg span{display:block;font-size:11px;text-align:center;padding:3px 0;background:var(--pan)}
.stg.on{opacity:1;border-color:#fff}
.big{font-family:'Bungee',sans-serif;font-size:clamp(48px,14vw,110px);line-height:1;margin:0}
.big.win{background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent}
.big.lose{color:#6f6c96}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#load{position:fixed;inset:0;z-index:40;background:#07060f;display:flex;align-items:center;justify-content:center;font-family:'Bungee',sans-serif;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.logo,.dice.roll,#bS.rdy{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv" width="960" height="540"></canvas><div id="cut"><div id="cutT">재뿌리기!!</div><span id="cutH">공격 버튼 = 건너뛰기</span></div><div id="keys">이동 ←→ / A D · 점프 ↑ / W · 가드 ↓ / S · 펀치 Z / J · 킥 X / K · 필살기 C / L · 태그 V</div></div>
  <div id="pad">
    <div id="dpad" class="pb"><i class="u">점프</i><i class="dn">가드</i><i class="l">◀</i><i class="r">▶</i><div id="knob"></div></div>
    <div id="bP" class="pb" data-k="p">P</div>
    <div id="bK" class="pb" data-k="k">K</div>
    <div id="bS" class="pb" data-k="s">필살</div>
    <div id="bT" class="pb" data-k="t">태그</div>
    <div id="hint">왼쪽 패드: 이동 · 위 점프 · 아래 가드<br>P 펀치 · K 킥 · 게이지가 차면 필살 또는 태그(라운드당 1회)</div>
  </div>
</div>
<button id="snd" aria-label="소리 켜기/끄기">♪ON</button>

<section id="sTitle" class="scr"><img id="ttl" src="assets/title.jpg" alt="큐떱대전"><form id="titleForm"><label for="nick">닉네임</label><input id="nick" type="text" minlength="2" maxlength="16" required autocomplete="nickname" placeholder="2~16자"><button class="btn" id="tGo">시작하기</button></form></section>
<section id="sSel" class="scr">
  <h1 class="logo">큐떱대전<small>캐릭터를 고르세요</small></h1>
  <div class="pv"><canvas id="pv" width="540" height="600"></canvas><div id="pvN"></div></div>
  <div class="cards" id="cards"></div>
  <button class="btn" id="go" disabled>대전 시작</button>
  <p class="sub" id="best"></p>
  <div class="row" id="onlineRow"><button class="btn ghost" id="quickMatch">빠른 대전</button><button class="btn ghost" id="rankedMatch">랭킹전</button><button class="btn ghost" id="leaderboard">누적 순위</button></div>
  <div class="row" id="netRow"><button class="btn ghost" id="nHost">온라인 방 만들기</button><button class="btn ghost" id="nJoin">방 참가</button></div>
</section>
<section id="sNet" class="scr"><div class="nbox" id="netBox"></div></section>

<section id="sVs" class="scr">
  <p class="sub" id="vsT"><span class="dice roll" id="dice"><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i></span><span id="vsMsg">상대를 뽑는 중</span></p>
  <div class="vsrow">
    <div class="slot"><div class="face"><img id="vsP" alt=""></div><h3 id="vsPn"></h3><p>YOU</p></div>
    <div class="vs">VS</div>
    <div class="slot"><div class="face" id="vsCf"><img id="vsC" alt=""></div><h3 id="vsCn">?</h3><p>CPU</p></div>
  </div>
  <div class="stages" id="stages"></div>
</section>

<section id="sRes" class="scr">
  <h2 class="big" id="resT"></h2>
  <p class="sub" id="resS"></p>
  <div class="row"><button class="btn" id="resA"></button><button class="btn ghost" id="resB">캐릭터 변경</button></div>
</section>
<div id="load">LOADING</div>

async function connectQueue(search,match){

      const reply=await onlineApi('/result',{id,winner});
      if(reply.confirmed){message='랭킹전 · 누적 순위에 반영됨';break}
      if(reply.disputed){message='양쪽 결과가 달라 점수가 반영되지 않았어요.';break}
      await new Promise(resolve=>setTimeout(resolve,1200));

  }catch(e){
    if(lastOnlineMatch===id&&$('sRes').classList.contains('show'))status.textContent='랭킹 서버에서 결과를 확인하지 못했어요.';

function frameOf(f){

  if(s==='punch')return f.t<.05?'idle':'punch';
  if(s==='kick')return f.t<.08?'idle':'kick';
  if(s==='ko')return f.down?'ko':'hit';
  if(s==='rec')return'idle';

    for(let i=0;i<2;i++){const dx=left?x+w-14-i*22:x+14+i*22;cx.beginPath();cx.arc(dx,y+h+38,7,0,6.283);cx.fillStyle=i<f.wins?'#fff3b0':'rgba(11,10,28,.7)';cx.fill();cx.lineWidth=2;cx.strokeStyle='#fff';cx.stroke()}
  };

  cx.fillStyle='rgba(11,10,28,.82)';cx.beginPath();cx.arc(VW/2,36,30,0,6.283);cx.fill();cx.lineWidth=3;cx.strokeStyle=holo(VW/2-30,VW/2+30);cx.stroke();
  txt(String(Math.ceil(timer)),VW/2,38,26,timer<10?'#ff4d6a':'#fff');

function drawAmb(tm){
  const id=stage.id;cx.save();
  for(const a of amb){ if(id==='anime'){const y=(a.y+tm*50*a.s)%VH,x=(a.x+Math.sin(tm*.8+a.p)*40-camX*.3+VW*4)%VW;cx.fillStyle='rgba(255,190,220,.85)';cx.beginPath();cx.ellipse(x,y,6*a.s,3.4*a.s,tm*2+a.p,0,6.283);cx.fill()}
    else if(id==='band'||id==='concert'){const y=VH-((a.y+tm*24*a.s)%VH),x=(a.x-camX*.2+VW*4)%VW;cx.globalAlpha=.35+.3*Math.sin(tm*3+a.p);cx.fillStyle=a.p>3?'#c77dff':'#5ef2e0';cx.beginPath();cx.arc(x,y,2.2*a.s,0,6.283);cx.fill()}
    else if(id==='snow'){const y=(a.y+tm*42*a.s)%VH,x=(a.x+Math.sin(tm+a.p)*24-camX*.3+VW*4)%VW;cx.globalAlpha=.85;cx.fillStyle='#fff';cx.beginPath();cx.arc(x,y,2.6*a.s,0,6.283);cx.fill()}
    else if(id==='aqua'){const y=VH-((a.y+tm*36*a.s)%VH),x=(a.x+Math.sin(tm*1.3+a.p)*14-camX*.2+VW*4)%VW;cx.globalAlpha=.5;cx.strokeStyle='#cfefff';cx.lineWidth=1.5;cx.beginPath();cx.arc(x,y,4*a.s,0,6.283);cx.stroke()}
    else if(id==='park'){const y=(a.y+tm*60*a.s)%VH,x=(a.x+Math.sin(tm*2+a.p)*30-camX*.3+VW*4)%VW;cx.globalAlpha=.9;cx.fillStyle=['#ff6fb5','#ffe27a','#7fe6ff','#b7a2ff'][Math.floor(a.p*10)%4];cx.save();cx.translate(x,y);cx.rotate(tm*3+a.p);cx.fillRect(-4*a.s,-2*a.s,8*a.s,4*a.s);cx.restore()}
    else if(id==='hanok'||id==='rooftop'){const y=VH*.85-((a.y+tm*14*a.s)%(VH*.7)),x=(a.x+Math.sin(tm*.7+a.p)*30-camX*.2+VW*4)%VW;cx.globalAlpha=.4+.4*Math.sin(tm*2.5+a.p);cx.fillStyle='#ffd98a';cx.beginPath();cx.arc(x,y,2.2*a.s,0,6.283);cx.fill()}
    else{const y=(a.y+Math.sin(tm*.5+a.p)*20+VH)%VH*.7,x=(a.x+tm*8*a.s-camX*.2+VW*4)%VW;cx.globalAlpha=.25+.2*Math.sin(tm*2+a.p);cx.fillStyle=id==='gym'?'#fff2c2':'#fff';cx.beginPath();cx.arc(x,y,1.8*a.s,0,6.283);cx.fill()} }
  cx.restore();
  if((id==='band'||id==='concert')&&bgm&&AC){const b=Math.max(0,1-(AC.currentTime-bgm.beat)*5);cx.fillStyle='rgba(190,110,255,'+(b*.1)+')';cx.fillRect(0,0,VW,VH)}
}
function render(tm){
  cx.setTransform(cv.width/VW,0,0,cv.height/VH,0,0);
  if(mode!=='fight'||!P){cx.fillStyle='#07060f';cx.fillRect(0,0,VW,VH);return}
  cx.save();const sk=shake>.5?shake:0;cx.translate((Math.random()-.5)*sk,(Math.random()-.5)*sk);
  const bg=IMG['bg_'+stage.id];if(bg){const r=bg.width/WW;cx.drawImage(bg,camX*r,0,VW*r,bg.height,-8,-8,VW+16,VH+16)}
  drawAmb(tm);
  const dim=freeze?.5:0;if(dim>0){cx.fillStyle='rgba(8,6,26,'+dim+')';cx.fillRect(-10,-10,VW+20,VH+20)}
  const order=(P.st==='ko'||C.st==='hit'||(freeze&&freeze.f===P))?[C,P]:[P,C];if(freeze&&freeze.f===C){order[0]=P;order[1]=C}
  if(zone){const a=Math.min(1,zone.t/.5,(3.8-zone.t)/.2);cx.save();cx.globalAlpha=.8*a;cx.fillStyle='#ff5c8a';cx.beginPath();cx.ellipse(zone.x-camX,GROUND+6,zone.w/2,17,0,0,6.283);cx.fill();cx.globalAlpha=.6*a;cx.fillStyle='#ffc2d4';cx.beginPath();cx.ellipse(zone.x-camX-zone.w*.15,GROUND+2,zone.w*.22,5,0,0,6.283);cx.fill();cx.restore()}
  for(const f of order)drawF(f,tm);
  for(const f of[P,C]){const s=f.rev>0?'?!':f.slip>0?'~~':f.dizzy>0?'★':'';if(s&&f.st!=='ko'){cx.save();cx.font='900 30px sans-serif';cx.textAlign='center';cx.lineWidth=5;cx.strokeStyle='#2a1030';cx.fillStyle=f.rev>0?'#ff5c8a':f.slip>0?'#ffb3cc':'#ffe27a';const x=f.x-camX+Math.sin(tm*9)*8,y=GROUND-f.y-265+Math.cos(tm*7)*4;cx.strokeText(s,x,y);cx.fillText(s,x,y);cx.restore()}}
  if(flood){const a=Math.min(1,flood.t/.5,(3.2-flood.t)/.4),h=78*a;cx.save();cx.globalAlpha=.42;cx.fillStyle='#6cc6ff';cx.beginPath();cx.moveTo(-10,VH+10);for(let x=-10;x<=VW+10;x+=30)cx.lineTo(x,GROUND+12-h+Math.sin(x*.03+tm*5)*5);cx.lineTo(VW+10,VH+10);cx.closePath();cx.fill();cx.restore()}
  // projectiles
  for(const p of proj){const sx=p.x-camX,d=p.vx>0?1:-1;cx.save();cx.translate(sx,p.y);
    if(p.kind==='rocket'){cx.scale(d,1);cx.save();cx.globalCompositeOperation='lighter';const g=cx.createRadialGradient(-34,0,2,-34,0,34);g.addColorStop(0,'#fff');g.addColorStop(.4,'#ffb3e1');g.addColorStop(1,'rgba(255,100,160,0)');cx.fillStyle=g;cx.beginPath();cx.ellipse(-40,0,44+Math.sin(tm*60)*6,15,0,0,6.283);cx.fill();cx.restore();
      cx.fillStyle='#f4f4fb';cx.strokeStyle='#2a2848';cx.lineWidth=2.5;rr(-24,-9,40,18,7);cx.fill();cx.stroke();cx.fillStyle='#ff6b8e';cx.beginPath();cx.moveTo(16,-9);cx.quadraticCurveTo(38,0,16,9);cx.closePath();cx.fill();cx.stroke();
      cx.fillStyle='#b9bedb';cx.beginPath();cx.moveTo(-24,-9);cx.lineTo(-34,-18);cx.lineTo(-14,-9);cx.closePath();cx.fill();cx.stroke();cx.beginPath();cx.moveTo(-24,9);cx.lineTo(-34,18);cx.lineTo(-14,9);cx.closePath();cx.fill();cx.stroke()}
    else if(p.kind==='wave'){cx.scale(d,1);cx.globalCompositeOperation='lighter';cx.lineCap='round';const cs=[['#fff','#bfe6ff','#6fb8ff'],['#fff','#ffb3e1','#ff7fbf'],['#ffd0dc','#ff5c8a','#ff2d55']][p.col||0];for(let i=0;i<3;i++){cx.strokeStyle=cs[i];cx.globalAlpha=.95-i*.24;cx.lineWidth=8-i*2;cx.beginPath();cx.arc(-i*22,0,30+i*16+Math.min(40,p.t*60),-1.1,1.1);cx.stroke()}}
    else if(p.kind==='stick'){cx.scale(d,1);cx.save();cx.globalCompositeOperation='lighter';cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=3;for(let i=-1;i<2;i++){cx.beginPath();cx.moveTo(-40,i*7);cx.lineTo(-150-Math.random()*80,i*9);cx.stroke()}cx.restore();
      cx.fillStyle='#d9a55b';cx.strokeStyle='#5a3a1a';cx.lineWidth=2;rr(-42,-4,74,8,4);cx.fill();cx.stroke();cx.beginPath();cx.ellipse(34,0,8,6,0,0,6.283);cx.fill();cx.stroke()}
    else if(p.kind==='body'){const im=IMG[p.ch],fr=META[p.ch].frames[p.frame];cx.scale(d,1);if(p.spin)cx.rotate(p.t*18);if(im&&fr)cx.drawImage(im,fr[0],fr[1],fr[2],fr[3],-fr[2]*SC/2,-fr[3]*SC/2,fr[2]*SC,fr[3]*SC)}
    else{const R=p.big?40:17;cx.rotate(p.rot+p.t*14*d);cx.lineWidth=R*.72;cx.strokeStyle='#e0a868';cx.beginPath();cx.arc(0,0,R*.68,0,p.half?3.1416:6.283);cx.stroke();
      cx.lineWidth=R*.5;cx.strokeStyle=p.big?'#ff8ec4':['#ff9ecb','#6b3f24','#9ff0c8','#ffe27a'][p.c];cx.beginPath();cx.arc(0,0,R*.7,0,p.half?3.1416:6.283);cx.stroke();
      cx.fillStyle='#fff';for(let i=0;i<(p.big?10:6);i++){const q=i*6.283/(p.big?10:6);cx.fillRect(Math.cos(q)*R*.7-1.5,Math.sin(q)*R*.7-1.5,p.big?5:3,p.big?5:3)}}
    cx.restore()}
  // fx
  for(const e of fx){const a=1-e.t/e.d,sx=e.x-camX;cx.save();
    if(e.k==='p'){cx.globalAlpha=a;cx.fillStyle=e.col;cx.beginPath();cx.arc(sx,e.y,e.s*a,0,6.283);cx.fill()}
    else if(e.k==='r'){cx.globalAlpha=a;cx.strokeStyle=e.col;cx.lineWidth=6*a;cx.beginPath();cx.arc(sx,e.y,e.r*(1-a)+10,0,6.283);cx.stroke()}
    else if(e.k==='s'){cx.globalCompositeOperation='lighter';cx.globalAlpha=a;cx.translate(sx,e.y);cx.rotate(e.rot);cx.fillStyle='#fff';const R=e.r*(1.3-a*.5);cx.beginPath();for(let i=0;i<16;i++){const q=i*Math.PI/8,r2=i%2?R*.28:R;cx.lineTo(Math.cos(q)*r2,Math.sin(q)*r2)}cx.closePath();cx.fill()}
    else if(e.k==='c'){cx.globalCompositeOperation='lighter';cx.globalAlpha=a;cx.translate(sx,e.y);cx.rotate(e.rot+e.t*8);cx.fillStyle=['#8ef6ff','#c9a6ff','#fff'][Math.floor(e.s)%3];cx.beginPath();cx.moveTo(0,-e.s);cx.lineTo(e.s*.6,0);cx.lineTo(0,e.s);cx.lineTo(-e.s*.6,0);cx.closePath();cx.fill()}
    else if(e.k==='l'){cx.globalAlpha=a*.8;cx.strokeStyle='#fff';cx.lineWidth=3;cx.beginPath();cx.moveTo(sx,e.y);cx.lineTo(sx-e.dir*e.w,e.y);cx.stroke()}
    else if(e.k==='n'){cx.globalAlpha=a;txt('♪',sx,e.y,e.s,'#fff','center','sans-serif',3)}
    else if(e.k==='h'){cx.globalAlpha=a;cx.translate(sx,e.y);cx.scale(e.s/14,e.s/14);cx.fillStyle='#ff6fa5';cx.beginPath();cx.moveTo(0,7);cx.bezierCurveTo(-15,-5,-8,-17,0,-7);cx.bezierCurveTo(8,-17,15,-5,0,7);cx.fill()}
    else if(e.k==='cl'){cx.globalCompositeOperation='lighter';cx.globalAlpha=a;cx.translate(sx,e.y);cx.rotate(e.rot);cx.strokeStyle='#8ef6ff';cx.lineCap='round';cx.lineWidth=5;for(let i=-1;i<2;i++){cx.beginPath();cx.moveTo(-42*e.dir,i*15-22);cx.quadraticCurveTo(0,i*15,42*e.dir,i*15+26);cx.stroke()}}
    else if(e.k==='beam'){cx.globalCompositeOperation='lighter';cx.lineCap='round';const w=Math.sin(Math.min(1,e.t/e.d)*3.1416);for(let q=0;q<2;q++){cx.strokeStyle=e.gold?(q?'#fff3b0':'#ffc93c'):e.pur?(q?'#e0b8ff':'#8b5cf6'):(q?'#5ef2ff':'#ff6fb5');cx.lineWidth=16*w+2;cx.beginPath();for(let x=0;x<=1000;x+=14){const yy=Math.sin(x*.03-tm*34+q*3.1416)*18;cx.lineTo(sx+e.dir*x,e.y+yy)}cx.stroke()}cx.strokeStyle='#fff';cx.lineWidth=7*w;cx.beginPath();cx.moveTo(sx,e.y);cx.lineTo(sx+e.dir*1000,e.y);cx.stroke()}
    else if(e.k==='bolt'){cx.globalCompositeOperation='lighter';cx.globalAlpha=Math.min(1,a*2);cx.lineJoin='round';for(let q=0;q<2;q++){cx.strokeStyle=q?'#fff':'#6fd0ff';cx.lineWidth=q?5:16;cx.beginPath();cx.moveTo(sx+Math.sin(e.seed)*60,-10);for(let i=1;i<=8;i++){const yy=e.y*i/8;cx.lineTo(sx+(i===8?0:Math.sin(e.seed*i*1.7+Math.floor(e.t*30))*46),yy)}cx.stroke()}cx.fillStyle='rgba(180,230,255,.8)';cx.beginPath();cx.ellipse(sx,e.y,70*a,16*a,0,0,6.283);cx.fill()}
    else if(e.k==='d'){cx.globalAlpha=Math.min(1,a*2);txt(String(e.txt),sx,e.y-(1-a)*46,24,'#fff','center',0,5)}
    cx.restore()}
  cx.restore();
  if(flash>0){cx.fillStyle='rgba(255,255,255,'+flash*1.3+')';cx.fillRect(0,0,VW,VH)}
  hud(tm);
  if(msg){const a=msg.t/msg.dur,sc=a<.12?2.2-a*10:1,al=a>.8?(1-a)*5:1;cx.save();cx.globalAlpha=Math.max(0,al);cx.translate(VW/2,225);cx.scale(sc,sc);
    const big=msg.txt==='K.O.';txt(msg.txt,0,0,big?150:msg.txt.length>7?74:92,big?'#ff4d6a':holo(-260,260),'center',0,16);if(msg.sub)txt(msg.sub,0,74,30,'#fff','center',"'Black Han Sans'",7);cx.restore()}
}

function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2.5,window.devicePixelRatio||1),w=Math.max(480,Math.min(2400,Math.round(r.width*d)));if(cv.width!==w){cv.width=w;cv.height=Math.round(w*9/16)}}
addEventListener('resize',fit);
let last=0,acc=0;
function loop(ts){const tm=ts/1000;let dt=Math.min(.1,tm-last);last=tm;acc+=dt;let n=0;while(acc>=1/120&&n<12){update(1/120);acc-=1/120;n++}if(net&&net.host&&net.ok&&mode==='fight'&&P){net.acc+=dt;if(net.acc>=1/30){net.acc=0;netSnap()}}render(tm);requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(AC)AC.suspend();if(bgm)bgA.pause()}else{if(AC&&!muted)AC.resume();if(bgm)bgA.play().catch(()=>{});last=performance.now()/1000;acc=0}});
window.__bg=()=>bgA?{t:bgA.currentTime,paused:bgA.paused,err:!!bgA.error,routed:!!bgSrc,gain:musG?musG.gain.value:null}:null;
window.__g={get net(){return net},get s(){return{mode,phase,P,C,stage,pick,opp,streak,timer,round}},update,held,buf,set level(v){level=v}};
(async function(){
  const jobs=[];for(const k of ORDER){jobs.push(loadImg(k,'assets/'+k+'.webp'),loadImg(k+'_face','assets/'+k+'_face.webp'))}

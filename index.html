</style>

    if(p.kind==='rocket'){cx.scale(d,1);cx.save();cx.globalCompositeOperation='lighter';const g=cx.createRadialGradient(-34,0,2,-34,0,34);g.addColorStop(0,'#fff');g.addColorStop(.4,'#ffb3e1');g.addColorStop(1,'rgba(255,100,160,0)');cx.fillStyle=g;cx.beginPath();cx.ellipse(-40,0,44+Math.sin(tm*60)*6,15,0,0,6.283);cx.fill();cx.restore();
      cx.fillStyle='#f4f4fb';cx.strokeStyle='#2a2848';cx.lineWidth=2.5;rr(-24,-9,40,18,7);cx.fill();cx.stroke();cx.fillStyle='#ff6b8e';cx.beginPath();cx.moveTo(16,-9);cx.quadraticCurveTo(38,0,16,9);cx.closePath();cx.fill();cx.stroke();
      cx.fillStyle='#b9bedb';cx.beginPath();cx.moveTo(-24,-9);cx.lineTo(-34,-18);cx.lineTo(-14,-9);cx.closePath();cx.fill();cx.stroke();cx.beginPath();cx.moveTo(-24,9);cx.lineTo(-34,18);cx.lineTo(-14,9);cx.closePath();cx.fill();cx.stroke()}
    else if(p.kind==='pulse'){
      cx.scale(d,1);cx.shadowColor=CH.W.col;cx.shadowBlur=18;cx.fillStyle=CH.W.col;cx.strokeStyle='#fff';cx.lineWidth=3;
      cx.beginPath();cx.moveTo(31,0);cx.bezierCurveTo(14,-39,-16,-23,-14,0);cx.bezierCurveTo(-16,23,14,39,31,0);cx.fill();cx.stroke();
    }
    else{const R=p.big?40:17;cx.rotate(p.rot+p.t*14*d);cx.lineWidth=R*.72;cx.strokeStyle='#e0a868';cx.beginPath();cx.arc(0,0,R*.68,0,6.283);cx.stroke();
      cx.lineWidth=R*.5;cx.strokeStyle=p.big?'#ff8ec4':['#ff9ecb','#6b3f24','#9ff0c8','#ffe27a'][p.c];cx.beginPath();cx.arc(0,0,R*.7,0,6.283);cx.stroke();
      cx.fillStyle='#fff';for(let i=0;i<(p.big?10:6);i++){const q=i*6.283/(p.big?10:6);cx.fillRect(Math.cos(q)*R*.7-1.5,Math.sin(q)*R*.7-1.5,p.big?5:3,p.big?5:3)}}
    cx.restore()}
  // fx
  for(const e of fx){const a=1-e.t/e.d,sx=e.x-camX;cx.save();
    if(e.k==='p'){cx.globalAlpha=a;cx.fillStyle=e.col;cx.beginPath();cx.arc(sx,e.y,e.s*a,0,6.283);cx.fill()}
    else if(e.k==='r'){cx.globalAlpha=a;cx.strokeStyle=e.col;cx.lineWidth=6*a;cx.beginPath();cx.arc(sx,e.y,e.r*(1-a)+10,0,6.283);cx.stroke()}
    else if(e.k==='s'){cx.globalCompositeOperation='lighter';cx.globalAlpha=a;cx.translate(sx,e.y);cx.rotate(e.rot);cx.fillStyle='#fff';const R=e.r*(1.3-a*.5);cx.beginPath();for(let i=0;i<16;i++){const q=i*Math.PI/8,r2=i%2?R*.28:R;cx.lineTo(Math.cos(q)*r2,Math.sin(q)*r2)}cx.closePath();cx.fill()}
    else if(e.k==='c'){cx.globalCompositeOperation='lighter';cx.globalAlpha=a;cx.translate(sx,e.y);cx.rotate(e.rot+e.t*8);cx.fillStyle=['#8ef6ff','#c9a6ff','#fff'][Math.floor(e.s)%3];cx.beginPath();cx.moveTo(0,-e.s);cx.lineTo(e.s*.6,0);cx.lineTo(0,e.s);cx.lineTo(-e.s*.6,0);cx.closePath();cx.fill()}
    else if(e.k==='l'){cx.globalAlpha=a*.8;cx.strokeStyle='#fff';cx.lineWidth=3;cx.beginPath();cx.moveTo(sx,e.y);cx.lineTo(sx-e.dir*e.w,e.y);cx.stroke()}
    else if(e.k==='n'){cx.globalAlpha=a;txt('♪',sx,e.y,e.s,'#fff','center','sans-serif',3)}
    else if(e.k==='d'){cx.globalAlpha=Math.min(1,a*2);txt(String(e.txt),sx,e.y-(1-a)*46,24,'#fff','center',0,5)}
    cx.restore()}
  cx.restore();
  if(flash>0){cx.fillStyle='rgba(255,255,255,'+flash*1.3+')';cx.fillRect(0,0,VW,VH)}
  hud(tm);
  if(freeze&&freeze.portrait){
    const {f,t}=freeze,col=CH[f.ch].col,move=ALT_SPECIAL[f.ch],side=f.face>0?1:-1;
    cx.save();cx.globalAlpha=Math.min(1,t*10,(.83-t)*16);cx.fillStyle='rgba(12,9,33,.94)';cx.fillRect(0,148,VW,245);
    cx.fillStyle=col;cx.fillRect(0,148,VW,5);cx.fillRect(0,388,VW,5);
    const portrait=IMG[f.ch+'_face'],px=side>0?110:630;
    if(portrait)cx.drawImage(portrait,0,28,portrait.width,portrait.width,px,151,236,236);
    const tx=side>0?620:340;
    txt(move.name,tx,247,54,col,'center',"'Black Han Sans'",9);
    txt(move.sub,tx,315,25,'#fff','center',0,5);
    cx.restore();
  }
  if(msg){const a=msg.t/msg.dur,sc=a<.12?2.2-a*10:1,al=a>.8?(1-a)*5:1;cx.save();cx.globalAlpha=Math.max(0,al);cx.translate(VW/2,225);cx.scale(sc,sc);
    const big=msg.txt==='K.O.';txt(msg.txt,0,0,big?150:msg.txt.length>7?74:92,big?'#ff4d6a':holo(-260,260),'center',0,16);if(msg.sub)txt(msg.sub,0,74,30,'#fff','center',"'Black Han Sans'",7);cx.restore()}
}
/* ---------- loop ---------- */
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2.5,window.devicePixelRatio||1),w=Math.max(480,Math.min(2400,Math.round(r.width*d)));if(cv.width!==w){cv.width=w;cv.height=Math.round(w*9/16)}}
addEventListener('resize',fit);
let last=0,acc=0;
function loop(ts){const tm=ts/1000;let dt=Math.min(.1,tm-last);last=tm;acc+=dt;let n=0;while(acc>=1/120&&n<12){update(1/120);acc-=1/120;n++}render(tm);requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(AC)AC.suspend();if(bgA&&bgm&&bgm.custom)bgA.pause()}else{if(AC&&!muted)AC.resume();if(bgA&&bgm&&bgm.custom){try{const p=bgA.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}last=performance.now()/1000;acc=0}});
window.__bg=()=>bgA?{t:bgA.currentTime,paused:bgA.paused,err:!!bgA.error,routed:!!bgSrc,gain:musG?musG.gain.value:null}:null;
window.__g={get s(){return{mode,phase,P,C,stage,pick,opp,streak,timer,round}},update,held,buf,set level(v){level=v}};
(async function(){
  const jobs=[];for(const k of ORDER){jobs.push(loadImg(k,'assets/'+k+'.webp'),loadImg(k+'_face','assets/'+k+'_face.webp'))}
  for(const s of STAGES)jobs.push(loadImg('bg_'+s.id,'assets/bg_'+s.id+'.jpg'));
  await Promise.all(jobs);try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))])}catch(e){}
  mkVids();buildSelect();fit();$('load').style.display='none';show('sSel');requestAnimationFrame(loop);
})();
